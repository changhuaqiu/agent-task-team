  <script>
    async function copyAsImage(btn) { const orig = btn.textContent; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#f1f5f9', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const blob = await new Promise(r => canvas.toBlob(r, 'image/png')); await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); btn.textContent = '✓ Copied!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
    async function downloadPNG(btn) { const orig = btn.textContent; btn.textContent = '⏳ ...'; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#f1f5f9', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const link = document.createElement('a'); link.download = 'harness-agent-loop.png'; link.href = canvas.toDataURL('image/png'); link.click(); btn.textContent = '✓ Done!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
    async function downloadPDF(btn) { const orig = btn.textContent; btn.textContent = '⏳ ...'; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#f1f5f9', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const imgData = canvas.toDataURL('image/png'); const { jsPDF } = window.jspdf; const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait'; const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] }); pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height); pdf.save('harness-agent-loop.pdf'); btn.textContent = '✓ Done!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
